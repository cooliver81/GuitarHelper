<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0c14" />
  <title>GuitarHelper</title>
  <meta name="description" content="Guitar practice in the browser: scale and shape diagrams with quizzes, play-along over chord progressions and recordings, tuner, metronome and mic drills. Nothing leaves your device." />
  <!-- Only this site's own files run; YouTube is allowed for the optional play-along embed. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; worker-src 'self' blob:; media-src 'self' blob:; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="GuitarHelper" />
  <meta property="og:description" content="Learn scale shapes across the neck, quiz yourself, and play along with backing tracks or your own recordings. Runs in the browser; nothing leaves your device." />
  <meta property="og:url" content="https://cooliver81.github.io/GuitarHelper/" />
  <meta property="og:image" content="https://cooliver81.github.io/GuitarHelper/docs/img/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="style.css" />
  <!-- Tab icon: the 🎸 emoji itself, drawn by the visitor's own emoji font. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B8%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="icon.png" />
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <button class="brand" id="brand" title="Home: Diagrams">
        <img class="brand-mark" src="icon.svg" alt="" width="26" height="26" />
        <span class="brand-name">GuitarHelper</span>
      </button>
      <nav id="tabs" aria-label="Sections"></nav>
    </div>
    <nav id="subnav" class="subnav" aria-label="Tools in this section" hidden></nav>
  </header>
  <main id="main"></main>
  <noscript>GuitarHelper needs JavaScript.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
